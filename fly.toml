# fly.toml app configuration file generated for miniflux-feed on 2025-05-02T13:49:40+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'miniflux-feed'
primary_region = 'cdg'

[machines]
  min_machines_running = 1
  max_machines_running = 1

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1